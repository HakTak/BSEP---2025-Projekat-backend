services:
  # The Database (Stores your settings/users)
  keycloak-db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    # No port mapping here means no conflict with local Postgres on 5432

  # The Keycloak Server
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      # Credentials for the Admin Console
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Database Connection
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
    ports:
      - "8180:8080"
    depends_on:
      - keycloak-db

volumes:
  postgres_data: # This keeps your data safe on your hard drive